log_level=3
xlog_level=3

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

socket=udp:172.25.57.39:5060

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "usrloc.so"
loadmodule "signaling.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"
loadmodule "rest_client.so"

modparam("usrloc", "working_mode_preset", "single-instance-no-db")
modparam("registrar", "received_avp", "$avp(received)")
modparam("nathelper", "received_avp", "$avp(received)")

route {

    xlog("L_INFO", "[$rm] from $fu to $ru\n");

    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }

        if (is_method("ACK")) {
            exit;
        }

        sl_send_reply(404, "Not Here");
        exit;
    }

    if (is_method("REGISTER")) {
        fix_nated_register();

        if (!save("location")) {
            xlog("L_ERR", "REGISTER save failed for $fu\n");
            sl_reply_error();
        } else {
            xlog("L_INFO", "REGISTER saved for $fu\n");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    if (is_method("INVITE")) {

        xlog("L_INFO", "INVITE received, notifying RestComm SLEE SipRA and checking TrustCall Core: caller=$fU callee=$rU\n");

        # Passive copy to RestComm JAIN SLEE SIP Resource Adaptor.
        # OpenSIPS remains the live enforcement/routing point.
        t_replicate("sip:127.0.0.1:5070");

        $var(decision) = "UNKNOWN";
        $var(ct) = "";
        $var(rcode) = "";

        if (rest_get("http://127.0.0.1:8081/decision?caller=$fU", $var(decision), $var(ct), $var(rcode))) {
            xlog("L_INFO", "TrustCall Core decision for $fU is [$var(decision)]\n");
        } else {
            xlog("L_ERR", "TrustCall Core request failed for caller=$fU; fail-open ALLOW\n");
            $var(decision) = "ALLOW";
        }

        if ($var(decision) == "BLOCK") {
            xlog("L_WARN", "TrustCall BLOCK: rejecting call $fU -> $rU\n");
            sl_send_reply(603, "Declined by TrustCall");
            exit;
        }

        if ($var(decision) == "WARN") {
            xlog("L_WARN", "TrustCall WARN: allowing call with warning header $fU -> $rU\n");
            append_hf("X-TrustCall-Warning: Suspicious caller\r\n");
            append_hf("X-TrustCall-Decision: WARN\r\n");
        } else {
            append_hf("X-TrustCall-Decision: ALLOW\r\n");
        }

        xlog("L_INFO", "TrustCall ALLOW/WARN/UNKNOWN: routing call to registered callee $rU\n");

        record_route();

        if (!lookup("location")) {
            xlog("L_WARN", "User not found: $ru\n");
            sl_send_reply(404, "User Not Found");
            exit;
        }

        xlog("L_INFO", "Location lookup success. New RURI=$ru DU=$du\n");

        if (!t_relay()) {
            xlog("L_ERR", "Failed to relay INVITE to callee\n");
            sl_reply_error();
        }

        exit;
    }

    if (!lookup("location")) {
        xlog("L_WARN", "User not found: $ru\n");
        sl_send_reply(404, "User Not Found");
        exit;
    }

    if (!t_relay()) {
        sl_reply_error();
    }
}
