stderror_enabled=yes

log_level=3
xlog_level=3

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

socket=udp:172.25.57.39:5060

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "usrloc.so"
loadmodule "signaling.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"
loadmodule "rest_client.so"
loadmodule "uac.so"

modparam("usrloc", "working_mode_preset", "single-instance-no-db")
modparam("registrar", "received_avp", "$avp(received)")
modparam("nathelper", "received_avp", "$avp(received)")

route {
    xlog("L_INFO", "[$rm] from $fu to $ru\n");

    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            if (!t_relay()) sl_reply_error();
            exit;
        }

        if (is_method("ACK")) exit;

        sl_send_reply(404, "Not Here");
        exit;
    }

    if (is_method("REGISTER")) {
        fix_nated_register();

        if (!save("location")) {
            xlog("L_ERR", "REGISTER save failed for $fu\n");
            sl_reply_error();
        } else {
            xlog("L_INFO", "REGISTER saved for $fu\n");
        }

        exit;
    }

    if (is_method("CANCEL")) {
        if (!t_relay()) sl_reply_error();
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE received, checking TrustCall Core: caller=$fU callee=$rU\n");

        $var(decision) = "UNKNOWN";
        $var(message_body) = "";
        $var(ct) = "";
        $var(rcode) = "";

        if (rest_get("http://127.0.0.1:8081/decision?caller=$fU&callee=$rU", $var(decision), $var(ct), $var(rcode))) {
            xlog("L_INFO", "TrustCall Core decision for $fU -> $rU is [$var(decision)]\n");
        } else {
            xlog("L_ERR", "TrustCall Core request failed for caller=$fU; fail-open ALLOW\n");
            $var(decision) = "ALLOW";
        }

        if (rest_get("http://127.0.0.1:8081/decision/message?caller=$fU&callee=$rU", $var(message_body), $var(ct), $var(rcode))) {
            xlog("L_INFO", "TrustCall message: $var(message_body)\n");
        } else {
            $var(message_body) = "TRUSTCALL: Decision " + $var(decision) + " for caller " + $fU;
        }

        if ($var(decision) == "ALERT") {
            xlog("L_WARN", "TrustCall HIGH ALERT: $var(message_body)\n");

            append_hf("X-TrustCall-Decision: ALERT\r\n");
            append_hf("X-TrustCall-Alert: High-risk caller detected.\r\n");

            uac_replace_from("TRUSTCALL ALERT - $fU", "sip:$fU@$fd");

            $var(message_uri) = "sip:" + $rU + "@" + $fd;
            $var(message_from) = "sip:trustcall@" + $fd;

            t_new_request(
                "MESSAGE",
                $var(message_uri),
                $var(message_from),
                $var(message_uri),
                $var(message_body)
            );

        } else if ($var(decision) == "WARN") {
            xlog("L_WARN", "TrustCall WARNING: $var(message_body)\n");

            append_hf("X-TrustCall-Decision: WARN\r\n");
            append_hf("X-TrustCall-Warning: Suspicious caller. Answer with caution.\r\n");

            uac_replace_from("TRUSTCALL WARNING - $fU", "sip:$fU@$fd");

            $var(message_uri) = "sip:" + $rU + "@" + $fd;
            $var(message_from) = "sip:trustcall@" + $fd;

            t_new_request(
                "MESSAGE",
                $var(message_uri),
                $var(message_from),
                $var(message_uri),
                $var(message_body)
            );

        } else {
            xlog("L_INFO", "TrustCall ALLOW: $var(message_body)\n");
            append_hf("X-TrustCall-Decision: ALLOW\r\n");
        }

        xlog("L_INFO", "TrustCall routing call to registered callee $rU\n");

        record_route();

        if (!lookup("location")) {
            xlog("L_WARN", "User not found: $ru\n");
            sl_send_reply(404, "User Not Found");
            exit;
        }

        xlog("L_INFO", "Location lookup success. New RURI=$ru DU=$du\n");

        if (!t_relay()) {
            xlog("L_ERR", "Failed to relay INVITE to callee\n");
            sl_reply_error();
        }

        exit;
    }

    if (is_method("MESSAGE")) {
        xlog("L_INFO", "SIP MESSAGE routing to $rU\n");

        if (!lookup("location")) {
            xlog("L_WARN", "MESSAGE receiver not registered: $rU\n");
            sl_send_reply(404, "User Not Found");
            exit;
        }

        xlog("L_INFO", "SIP MESSAGE receiver found. Routing to $ru\n");

        if (!t_relay()) sl_reply_error();

        exit;
    }

    if (!lookup("location")) {
        xlog("L_WARN", "User not found: $ru\n");
        sl_send_reply(404, "User Not Found");
        exit;
    }

    if (!t_relay()) sl_reply_error();
}
